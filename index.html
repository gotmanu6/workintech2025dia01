    <!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jogo da Velha</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-pink-400 min-h-screen flex items-center justify-center flex-col p-4">

  <h1 class="text-4xl font-bold mb-6">Jogo da Velha</h1>

  <div class="grid grid-cols-3 gap-2 w-72 mb-6">
    <!-- 9 células -->
    <button class="cell w-24 h-24 bg-pink-500 text-black text-5xl font-bold flex items-center justify-center" data-index="0"></button>
    <button class="cell w-24 h-24 bg-pink-500 text-black text-5xl font-bold flex items-center justify-center" data-index="1"></button>
    <button class="cell w-24 h-24 bg-pink-500 text-black text-5xl font-bold flex items-center justify-center" data-index="2"></button>
    <button class="cell w-24 h-24 bg-pink-500 text-black text-5xl font-bold flex items-center justify-center" data-index="3"></button>
    <button class="cell w-24 h-24 bg-pink-500 text-black text-5xl font-bold flex items-center justify-center" data-index="4"></button>
    <button class="cell w-24 h-24 bg-pink-500 text-black text-5xl font-bold flex items-center justify-center" data-index="5"></button>
    <button class="cell w-24 h-24 bg-pink-500 text-black text-5xl font-bold flex items-center justify-center" data-index="6"></button>
    <button class="cell w-24 h-24 bg-pink-500 text-black text-5xl font-bold flex items-center justify-center" data-index="7"></button>
    <button class="cell w-24 h-24 bg-pink-500 text-black text-5xl font-bold flex items-center justify-center" data-index="8"></button>
  </div>

  <div class="text-lg mb-4">
    <span class="mr-4">X: <span id="scoreX">0</span></span>
    <span>O: <span id="scoreO">0</span></span>
  </div>

  <div id="message" class="text-xl mt-2 h-8 text-pink-300"></div>

  <script>
    const cells = document.querySelectorAll('.cell');
    const scoreX = document.getElementById('scoreX');
    const scoreO = document.getElementById('scoreO');
    const message = document.getElementById('message');

    let board = Array(9).fill('');
    let currentPlayer = 'X';
    let scores = { X: 0, O: 0 };
    let gameOver = false;

    const winPatterns = [
      [0, 1, 2],
      [3, 4, 5],
      [6, 7, 8],
      [0, 3, 6],
      [1, 4, 7],
      [2, 5, 8],
      [0, 4, 8],
      [2, 4, 6],
    ];

    function checkWinner() {
      for (let pattern of winPatterns) {
        const [a, b, c] = pattern;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          return board[a];
        }
      }
      return board.includes('') ? null : 'Empate';
    }

    function resetGame() {
      board = Array(9).fill('');
      cells.forEach(cell => cell.textContent = '');
      currentPlayer = 'X';
      gameOver = false;
      message.textContent = '';
    }

    function updateBoard(index) {
      if (board[index] !== '' || gameOver) return;

      board[index] = currentPlayer;
      cells[index].textContent = currentPlayer;

      const winner = checkWinner();

      if (winner) {
        gameOver = true;
        if (winner === 'Empate') {
          message.textContent = 'Empate!';
        } else {
          message.textContent = `Vitória de ${winner}!`;
          scores[winner]++;
          scoreX.textContent = scores.X;
          scoreO.textContent = scores.O;
        }
        setTimeout(resetGame, 2000);
      } else {
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
      }
    }

    cells.forEach(cell => {
      cell.addEventListener('click', () => {
        const index = parseInt(cell.dataset.index);
        updateBoard(index);
      });
    });
  </script>

</body>
</html>

</body>
